<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Kolofon — unique wall art from Denmark">
    <link rel="icon" type="image/png" href="logo2.png">
    <title>Kolofon</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- Sticky Navigation Bar -->
    <header class="navbar">
        <div class="logo-container">
            <a href="index.html"><img src="logo.png" alt="Kolofon" class="logo-img" style="height: 45px; display: block;"></a>
        </div>
        <div class="nav-right">
            <a href="cart.html" class="icon-btn" aria-label="Shopping Bag">
                <span class="cart-count-bubble" style="display: none;">0</span>
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
            </a>
            <button class="icon-btn menu-toggle" aria-label="Menu">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
        </div>
    </header>

    <!-- Full Screen Mobile Menu Overlay -->
    <div class="mobile-menu-overlay">
        <nav class="mobile-nav">
            <a href="index.html" class="mobile-link" data-i18n="nav_home">Hjem</a>
            <a href="products.html" class="mobile-link" data-i18n="nav_products">Produkter</a>
            <a href="about.html" class="mobile-link" data-i18n="nav_about">Om os</a>
            <a href="contact.html" class="mobile-link" data-i18n="nav_contact">Kontakt</a>
        </nav>
    </div>

    <!-- Main Product Stage -->
    <main>
        <div class="breadcrumb-bar">
            <a href="products.html" class="breadcrumb-back"><span class="breadcrumb-arrow">←</span>Kollektion</a>
        </div>
        <section id="products" class="product-layout">
            <div class="viewer-column">
                <!-- Image Carousel -->
                <div class="image-carousel-container">
                    <div class="image-carousel-main">
                        <img id="product-image-main" src="" alt="Product Image" class="carousel-image">
                        <video id="product-video-main" class="carousel-video" muted loop playsinline preload="auto" hidden></video>
                        <button class="fullscreen-btn" id="fullscreen-btn" aria-label="Vis billede i fuld skærm">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"></path><path d="M21 8V5a2 2 0 0 0-2-2h-3"></path><path d="M16 21h3a2 2 0 0 0 2-2v-3"></path><path d="M3 16v3a2 2 0 0 0 2 2h3"></path></svg>
                        </button>
                        <div class="gallery-dots" id="gallery-dots" hidden></div>
                    </div>
                </div>

                <!-- Carousel Controls (for switching products) -->
                <div class="carousel-controls">
                    <button class="carousel-btn" id="prev-btn" aria-label="Previous Product">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
                    </button>
                    <button class="carousel-btn" id="next-btn" aria-label="Next Product">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
                    </button>
                </div>
            </div>
            
            <div class="info-box">
                <div class="details-content">
                
                    <h1 class="product-title" id="product-title">Loading...</h1>
                    <div class="product-author" id="product-author"></div>
                    <div class="product-price-row">
                        <span class="price" id="product-price"></span>
                        <span class="stock-status"></span>
                    </div>
                    <p class="product-description"></p>

                    <div class="specs-grid">
                        <div><div class="spec-label" data-i18n="dimensions">Dimensioner</div><div class="spec-value">24" x 36"</div></div>
                        <div><div class="spec-label" data-i18n="material">Materiale</div><div class="spec-value">Acrylic Glass</div></div>
                    </div>

                </div>

                <div class="action-area">
                    <button class="btn-primary full-width btn-add-to-cart">
                        <span class="btn-text" data-i18n="add_to_cart">Læg i Kurv</span>
                        <span class="btn-icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg></span>
                    </button>
                </div>
            </div>

            <div class="details-column">

                <div id="product-photo-wrap" style="display: none;">
                    <img id="product-photo" src="" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block;">
                </div>

                <div id="product-video-wrap" style="display: none;">
                    <video id="product-video" autoplay loop muted playsinline></video>
                </div>
            </div>
        </section>

        <!-- Other products, filled in by main.js -->
        <section class="recommendations" id="recommendations" hidden>
            <h2 class="recommendations-title">Andre værker</h2>
            <div class="recommendations-track" id="recommendations-track"></div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="footer-content">
            <div class="footer-section">
                <h4 data-i18n="footer_contact">Kontakt</h4>
                <p>Valmuevej 9, 1. 3.</p>
                <p>7000 Fredericia</p>
                <p>CVR: 40808914</p>
                <p><a href="mailto:simonlsamuelsen@gmail.com">simonlsamuelsen@gmail.com</a></p>
            </div>
            <div class="footer-section">
                <h4 data-i18n="footer_legal">Juridisk</h4>
                <a href="Handelsbetingelser.pdf" class="footer-link" target="_blank" data-i18n-link="terms">Handelsbetingelser</a>
                <br>
                <a href="privacy.html" class="footer-link" data-i18n-link="privacy">Privatlivspolitik</a>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; <span id="copyright-year">2026</span> Kolofon. <span data-i18n="footer_rights">Alle rettigheder forbeholdes.</span></p>
        </div>
    </footer>

    <!-- Full screen image viewer -->
    <div id="image-lightbox" class="image-lightbox" hidden>
        <button class="lightbox-close" id="lightbox-close" aria-label="Luk fuld skærm">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
        <img id="lightbox-image" src="" alt="">
    </div>

    <script src="main.js" defer></script>
</body>
</html>
