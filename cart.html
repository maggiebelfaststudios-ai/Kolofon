<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="logo2.png">
    <title>Cart - Kolofon</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <header class="navbar">
        <div class="logo-container">
            <a href="index.html"><img src="logo.png" alt="Kolofon" class="logo-img" style="height: 45px; display: block;"></a>
        </div>
        <div class="nav-right">
            <a href="cart.html" class="icon-btn" aria-label="Shopping Bag">
                <span class="cart-count-bubble" style="display: none;">0</span>
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
            </a>
            <button id="lang-btn" class="nav-text-btn" style="background:none; border:none; cursor:pointer; font-weight:500; margin-left:0.5rem; font-family: var(--font-sans);">EN</button>
            <button id="theme-btn" class="icon-btn" aria-label="Toggle dark mode">
                <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            </button>
            <button class="icon-btn menu-toggle" aria-label="Menu">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
        </div>
    </header>

    <div class="mobile-menu-overlay">
        <nav class="mobile-nav">
            <a href="index.html" class="mobile-link" data-i18n="nav_home">Hjem</a>
            <a href="products.html" class="mobile-link" data-i18n="nav_products">Produkter</a>
            <a href="about.html" class="mobile-link" data-i18n="nav_about">Om os</a>
            <a href="contact.html" class="mobile-link" data-i18n="nav_contact">Kontakt</a>
        </nav>
    </div>

    <main class="content-page">
        <h1 data-i18n="cart_title">Din Kurv</h1>
        
        <div class="cart-container">
            <!-- Items will be injected here by main.js -->
        </div>
    </main>

    <script src="main.js" defer></script>
</body>
</html>
