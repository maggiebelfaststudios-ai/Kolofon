<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - Kolofon</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="logo-container">
            <a href="index.html"><img src="logo.png" alt="Kolofon" class="logo-img" style="height: 30px; display: block;"></a>
        </div>
        <div class="nav-right">
            <a href="cart.html" class="icon-btn" aria-label="Shopping Bag">
                <span class="cart-count-bubble" style="display: none;">0</span>
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
            </a>
            <button class="icon-btn menu-toggle" aria-label="Menu">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
        </div>
    </header>

    <div class="mobile-menu-overlay">
        <nav class="mobile-nav">
            <a href="index.html" class="mobile-link">Home</a>
            <a href="products.html" class="mobile-link">Products</a>
            <a href="about.html" class="mobile-link">About</a>
            <a href="contact.html" class="mobile-link">Contact</a>
        </nav>
    </div>

    <main class="content-page">
        <h1>Your Cart</h1>
        
        <div class="cart-container">
            <!-- Items will be injected here by main.js -->
        </div>
    </main>

    <script src="main.js" defer></script>
</body>
</html>
