<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="logo2.png">
    <title>Kolofon</title>
    <link rel="stylesheet" href="https://use.typekit.net/hyx4cet.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .admin-container { max-width: 1000px; margin: 0 auto; padding: 2rem; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; padding-bottom: 1rem; border-bottom: 1px solid var(--color-border); }
        
        table { width: 100%; border-collapse: collapse; margin-bottom: 2rem; }
        th, td { text-align: left; padding: 1rem; border-bottom: 1px solid var(--color-border); }
        th { font-size: 0.75rem; text-transform: uppercase; color: #888; }
        
        .editor-panel { background: var(--color-bg-subtle); padding: 2rem; border-radius: 8px; margin-bottom: 2rem; }
        .editor-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        
        .btn-danger { background: #d32f2f; color: white; border: none; padding: 0.5rem 1rem; cursor: pointer; font-size: 0.75rem; text-transform: uppercase; }
        .btn-success { background: #2E7D32; color: white; border: none; padding: 1rem; cursor: pointer; text-transform: uppercase; letter-spacing: 0.05em; width: 100%; margin-top: 1rem; }
        .login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--color-bg); z-index: 2000; display: flex; align-items: center; justify-content: center; flex-direction: column; }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="logo-container">
            <span class="logo">KOLOFON // ADMIN</span>
        </div>
        <div class="nav-right">
            <button id="logout-btn" class="nav-text-btn" style="margin-right: 1rem; display: none;">Log ud</button>
            <a href="index.html" class="nav-text-btn">Tilbage til siden</a>
        </div>
    </header>

    <!-- Simulated Admin Login -->
    <div id="login-overlay" class="login-overlay">
        <h2 style="font-family: var(--font-serif); margin-bottom: 1.5rem;">Admin Login</h2>
        <form id="login-form" style="width: 100%; max-width: 300px;">
            <div class="form-group">
                <input type="email" id="admin-email" class="form-input" placeholder="admin@kolofon.com" required>
            </div>
            <div class="form-group">
                <input type="password" id="admin-pass" class="form-input" placeholder="Password" required>
            </div>
            <button type="submit" class="btn-primary full-width">Login</button>
        </form>
    </div>

    <main class="admin-container" style="padding-top: 80px;">
        <div class="admin-header">
            <h1>Administrator</h1>
            <div style="display: flex; gap: 1rem;">
                <button onclick="switchView('products')" id="tab-products" class="btn-primary">Produkter</button>
                <button onclick="switchView('orders')" id="tab-orders" class="btn-primary" style="background: transparent; color: #111; border: 1px solid #ccc;">Ordrer</button>
            </div>
            <div style="display: flex; gap: 1rem;">
                <button onclick="loadProducts()" class="btn-primary" style="background-color: #FF9800;">Genindlæs Data</button>
                <button onclick="exportData()" class="btn-primary">Eksporter & Download Katalog</button>
            </div>
        </div>

        <!-- PRODUCTS VIEW -->
        <div id="view-products">
            <div style="margin-bottom: 1rem;">
                <input type="text" id="product-search" class="form-input" placeholder="Søg efter titel eller kunstner..." style="max-width: 300px;">
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Billede (GLB)</th>
                        <th>Titel</th>
                        <th>Pris</th>
                        <th>Lagerantal</th>
                        <th>Handlinger</th>
                    </tr>
                </thead>
                <tbody id="product-table-body">
                    <!-- Rows generated by JS -->
                </tbody>
            </table>

            <!-- Add New Product -->
            <div class="editor-panel">
                <h2 style="margin-bottom: 1.5rem;">Tilføj Nyt Produkt</h2>
                <form id="add-form">
                    <div class="editor-grid">
                        <div class="form-group">
                            <label class="form-label">Titel</label>
                            <input type="text" id="new-title" class="form-input" placeholder="e.g. Abstract No. 5" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Kunstner</label>
                            <input type="text" id="new-author" class="form-input" placeholder="Artist Name">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Pris</label>
                            <input type="text" id="new-price" class="form-input" placeholder="DKK 2.000" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Lagerantal</label>
                            <input type="number" id="new-stock" class="form-input" placeholder="Antal enheder" value="1" min="0" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Produktbillede</label>
                            <input type="file" id="new-file" class="form-input" accept=".jpg,.jpeg,.png,.webp" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Baggrundsbillede</label>
                            <input type="file" id="new-background" class="form-input" accept=".jpg,.jpeg,.png,.webp">
                            <small id="background-status" style="color: #666; display: block; margin-top: 0.35rem;">Valgfrit — vises som baggrund på produktsiden.</small>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Video</label>
                            <input type="file" id="new-video" class="form-input" accept=".mp4,.webm,.mov">
                            <small style="color: #666; display: block; margin-top: 0.35rem;">Valgfrit — vises som et ekstra billede i galleriet.</small>
                        </div>
                        <div class="form-group" id="current-media" style="display: none;">
                            <label class="form-label">Nuværende filer</label>
                            <div id="current-media-list" style="display: grid; gap: 0.75rem;"></div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Materiale</label>
                            <input type="text" id="new-material" class="form-input" placeholder="Acrylic Glass">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Dimensioner</label>
                            <input type="text" id="new-dimensions" class="form-input" placeholder='60cm x 90cm'>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Beskrivelse</label>
                        <textarea id="new-desc" class="form-input" rows="3" placeholder="Produkt beskrivelse..."></textarea>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Beskrivelse (Engelsk)</label>
                        <textarea id="new-desc-en" class="form-input" rows="3" placeholder="Product description (English)..."></textarea>
                    </div>
                    <button type="submit" class="btn-success">Tilføj Produkt</button>
                </form>
            </div>
        </div>

        <!-- ORDERS VIEW -->
        <div id="view-orders" style="display: none;">
            <table>
                <thead>
                    <tr>
                        <th>Dato</th>
                        <th>Kunde</th>
                        <th>Varer</th>
                        <th>Total</th>
                        <th>Handling</th>
                    </tr>
                </thead>
                <tbody id="order-table-body">
                    <!-- Rows generated by JS -->
                </tbody>
            </table>
        </div>
    </main>

    <script>
        // --- SUPABASE CONNECTION ---
        const supabaseUrl = 'https://jxprvsfrsnikzkophoty.supabase.co';
        const supabaseKey = 'sb_publishable_PBq6r9zAfGDl77RxTzoGlw_NKLHIUP4'; // Replace with your ANON key if needed for public access, but this works for admin login
        const client = supabase.createClient(supabaseUrl, supabaseKey);

        let products = [];
        let editingProductId = null;
        let orders = [];

        async function loadProducts() {
            const { data, error } = await client
                .from('products')
                .select('*')
                .order('id', { ascending: true });

            if (error) {
                console.error('Error loading products:', error);
                alert('Kunne ikke hente produkter fra Supabase.');
                return;
            }

            // Normalize data
            products = data.map(p => ({ 
                ...p, 
                stockQuantity: p.stockQuantity ?? p.stockquantity ?? 0 
            }));
            renderTable();
        }

        async function loadOrders() {
            const { data, error } = await client
                .from('orders')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error('Error loading orders:', error);
                return;
            }
            orders = data;
            renderOrderTable();
        }

        const tableBody = document.getElementById('product-table-body');
        const orderTableBody = document.getElementById('order-table-body');
        const addForm = document.getElementById('add-form');

        function switchView(viewName) {
            const prodView = document.getElementById('view-products');
            const orderView = document.getElementById('view-orders');
            const btnProd = document.getElementById('tab-products');
            const btnOrder = document.getElementById('tab-orders');

            if (viewName === 'products') {
                prodView.style.display = 'block';
                orderView.style.display = 'none';
                btnProd.style.background = '#111'; btnProd.style.color = '#fff'; btnProd.style.border = 'none';
                btnOrder.style.background = 'transparent'; btnOrder.style.color = '#111'; btnOrder.style.border = '1px solid #ccc';
            } else {
                prodView.style.display = 'none';
                orderView.style.display = 'block';
                btnOrder.style.background = '#111'; btnOrder.style.color = '#fff'; btnOrder.style.border = 'none';
                btnProd.style.background = 'transparent'; btnProd.style.color = '#111'; btnProd.style.border = '1px solid #ccc';
                loadOrders();
            }
        }

        // Search Listener
        document.getElementById('product-search').addEventListener('input', renderTable);

        function renderTable() {
            const searchTerm = document.getElementById('product-search').value.toLowerCase();
            tableBody.innerHTML = '';
            
            const filtered = products.filter(p => (p.title || '').toLowerCase().includes(searchTerm) || (p.author || '').toLowerCase().includes(searchTerm));

            filtered.forEach((product, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td style="font-family: monospace; font-size: 0.85rem;">${product.src}</td>
                    <td><strong>${product.title}</strong></td>
                    <td>${product.price}</td>
                    <td>${product.stockQuantity > 0 ? product.stockQuantity + ' stk.' : '<span style="color:red">Udsolgt</span>'}</td>
                    <td>
                        <button onclick="editProduct('${product.id}')" class="btn-primary" style="margin-right: 0.5rem; padding: 0.5rem 1rem; font-size: 0.75rem;">Rediger</button>
                        <button onclick="deleteProduct('${product.id}')" class="btn-danger">Fjern</button>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        }

        function renderOrderTable() {
            orderTableBody.innerHTML = '';
            orders.forEach(order => {
                const date = new Date(order.created_at).toLocaleString('da-DK');
                const items = order.items.map(i => `${i.quantity}x ${i.title}`).join(', ');
                const customer = order.customer_details ?
                    `<strong>${order.customer_details.fullName}</strong><br>${order.email}<br>${order.customer_details.address}, ${order.customer_details.city}` :
                    order.email;

                const shippedBtn = order.shipped_notification_sent
                    ? `<span style="color: green; font-size: 0.85rem;">✓ Afsendt</span>${order.tracking_number ? `<br><span style="font-size:0.7rem; color:#666;">${order.tracking_number}</span>` : ''}<br><button onclick="openLabel(\'${order.order_id}\')" class="btn-primary" style="margin-top:0.35rem; padding: 0.3rem 0.6rem; font-size: 0.7rem;">Print label</button>`
                    : `<button onclick="notifyShipped(\'${order.order_id}\', this)" class="btn-primary" style="padding: 0.4rem 0.75rem; font-size: 0.75rem;">Marker afsendt</button>`;

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td style="vertical-align: top;">${date}</td>
                    <td style="vertical-align: top;">${customer}</td>
                    <td style="vertical-align: top;">${items}</td>
                    <td style="vertical-align: top;">DKK ${parseFloat(order.total).toLocaleString('da-DK')}</td>
                    <td style="vertical-align: top;">${shippedBtn}</td>
                `;
                orderTableBody.appendChild(row);
            });
        }

        // Marking an order shipped does three things in order: book the parcel
        // with Shipmondo, hand over the label to print, then tell the customer.
        async function notifyShipped(orderId, btn) {
            if (!confirm(`Opret GLS-forsendelse og send besked til kunden for ordre ${orderId}?`)) return;
            btn.disabled = true;

            const { data: { session } } = await client.auth.getSession();
            const authHeaders = {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${session.access_token}`,
            };

            // 1. Book the parcel
            btn.textContent = 'Opretter forsendelse...';
            const shipRes = await fetch(`${supabaseUrl}/functions/v1/create-shipment`, {
                method: 'POST', headers: authHeaders, body: JSON.stringify({ order_id: orderId }),
            });
            const shipData = await shipRes.json();

            if (!shipRes.ok) {
                alert('Fejl ved oprettelse af forsendelse: ' + (shipData.error || 'Ukendt fejl'));
                btn.disabled = false;
                btn.textContent = 'Marker afsendt';
                return;
            }

            // 2. Open the label so it can be printed
            btn.textContent = 'Henter label...';
            await openLabel(orderId);

            // 3. Tell the customer. The parcel already exists by this point, so a
            //    failure here is reported without implying the shipment failed.
            btn.textContent = 'Sender besked...';
            const mailRes = await fetch(`${supabaseUrl}/functions/v1/send-shipping-notification`, {
                method: 'POST', headers: authHeaders, body: JSON.stringify({ order_id: orderId }),
            });

            if (!mailRes.ok) {
                const err = await mailRes.json().catch(() => ({}));
                alert(`Forsendelsen er oprettet (${shipData.tracking_number || 'uden nummer'}), men beskeden til kunden fejlede: ${err.error || 'Ukendt fejl'}`);
            }

            loadOrders();
        }

        // Labels are stored on the order, so they can be reprinted without
        // going back to Shipmondo.
        async function openLabel(orderId) {
            const { data, error } = await client
                .from('orders')
                .select('label_base64')
                .eq('order_id', orderId)
                .single();

            if (error || !data || !data.label_base64) {
                alert('Forsendelsen findes, men label kunne ikke hentes. Du kan printe den i Shipmondo.');
                return;
            }

            const binary = atob(data.label_base64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            const url = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));

            window.open(url, '_blank');
            setTimeout(() => URL.revokeObjectURL(url), 60000);
        }

        async function deleteProduct(id) {
            if(!confirm('Er du sikker på, at du vil slette dette produkt fra databasen?')) return;

            // 1. Get the product to find the file path
            const { data: product, error: fetchError } = await client
                .from('products')
                .select('src')
                .eq('id', id)
                .single();

            // 2. Delete file from Storage (if it exists and is in our bucket)
            if (product && product.src && product.src.includes('/models/')) {
                const fileName = product.src.split('/models/').pop();
                const { error: storageError } = await client.storage.from('images').remove([fileName]);
                if (storageError) console.error('Fejl ved sletning af fil:', storageError);
            }

            // 3. Delete row from Database
            const { error } = await client.from('products').delete().eq('id', id);
            
            if (error) {
                alert('Fejl ved sletning: ' + error.message);
            } else {
                loadProducts();
            }
        }

        addForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            console.log("--- STARTING PRODUCT SAVE PROCESS ---");
            
            // UI: Start Loading
            const submitBtn = addForm.querySelector('button[type="submit"]');
            const originalText = submitBtn.textContent;
            submitBtn.textContent = editingProductId ? 'Opdaterer...' : 'Uploader og Gemmer...';
            submitBtn.disabled = true;

            // 1. Upload files to Supabase Storage
            const file = document.getElementById('new-file').files[0];
            const backgroundFile = document.getElementById('new-background').files[0];
            const videoFile = document.getElementById('new-video').files[0];

            // Validation: the product image is required only for new products
            if (!editingProductId && !file) {
                console.warn("Validation failed: No file selected for new product.");
                alert("Vælg venligst en fil.");
                submitBtn.textContent = originalText;
                submitBtn.disabled = false;
                return;
            }

            // Uploads one file and returns { fileName, publicUrl }, or null if it failed.
            async function uploadFile(imageFile, label) {
                const fileName = `${Date.now()}_${imageFile.name.replace(/\s+/g, '-')}`; // Clean filename
                console.log(`Attempting to upload ${label}: ${fileName}`);
                const { error: uploadError } = await client.storage.from('images').upload(fileName, imageFile);
                if (uploadError) {
                    console.error(`Upload failed (${label}):`, uploadError);
                    alert('Fejl ved upload af fil: ' + uploadError.message);
                    return null;
                }
                const { data: { publicUrl } } = client.storage.from('images').getPublicUrl(fileName);
                console.log(`${label} uploaded successfully. Public URL:`, publicUrl);
                return { fileName, publicUrl };
            }

            // Existing filename stored in a column, so the old file can be removed after a swap
            function oldFileFor(column) {
                if (!editingProductId) return null;
                const oldProduct = products.find(p => String(p.id) === String(editingProductId));
                const value = oldProduct && oldProduct[column];
                return value && value.includes('/images/') ? value.split('/images/').pop() : null;
            }

            let publicUrl = null;
            let backgroundUrl = null;
            let videoUrl = null;
            let oldFileNameToDelete = null;
            let oldBackgroundToDelete = null;
            let oldVideoToDelete = null;
            const newlyUploaded = []; // removed again if a later step fails

            // Abandon the save without leaving half-uploaded files behind
            const bailOut = async () => {
                if (newlyUploaded.length) await client.storage.from('images').remove(newlyUploaded);
                submitBtn.textContent = originalText;
                submitBtn.disabled = false;
            };

            if (file) {
                oldFileNameToDelete = oldFileFor('photo');
                const uploaded = await uploadFile(file, 'produktbillede');
                if (!uploaded) { await bailOut(); return; }
                newlyUploaded.push(uploaded.fileName);
                publicUrl = uploaded.publicUrl;
            }

            // Background and video are always optional, on create and edit alike
            if (backgroundFile) {
                oldBackgroundToDelete = oldFileFor('background');
                const uploaded = await uploadFile(backgroundFile, 'baggrundsbillede');
                if (!uploaded) { await bailOut(); return; }
                newlyUploaded.push(uploaded.fileName);
                backgroundUrl = uploaded.publicUrl;
            }

            if (videoFile) {
                oldVideoToDelete = oldFileFor('video');
                const uploaded = await uploadFile(videoFile, 'video');
                if (!uploaded) { await bailOut(); return; }
                newlyUploaded.push(uploaded.fileName);
                videoUrl = uploaded.publicUrl;
            }

            const productData = {
                title: document.getElementById('new-title').value,
                author: document.getElementById('new-author').value,
                price: document.getElementById('new-price').value,
                stockQuantity: parseInt(document.getElementById('new-stock').value, 10),
                material: document.getElementById('new-material').value,
                dimensions: document.getElementById('new-dimensions').value,
                description: document.getElementById('new-desc').value,
                description_en: document.getElementById('new-desc-en').value
            };

            if (publicUrl) {
                productData.photo = publicUrl;
            }

            if (backgroundUrl) {
                productData.background = backgroundUrl;
            }

            if (videoUrl) {
                productData.video = videoUrl;
            }

            let error = null;

            if (editingProductId) {
                // Update existing product
                console.log(`Updating existing product ID: ${editingProductId}`);
                const { error: updateError } = await client.from('products').update(productData).eq('id', editingProductId);
                error = updateError;
            } else {
                // Create new product
                productData.id = Date.now().toString();
                console.log(`Creating new product with ID: ${productData.id}`);
                const { error: insertError } = await client.from('products').insert([productData]);
                error = insertError;
            }

            if (error) {
                // DB write failed - remove anything we just uploaded to prevent orphans
                if (newlyUploaded.length) {
                    await client.storage.from('images').remove(newlyUploaded);
                }
                console.error('Supabase Error:', error);
                alert('Fejl: ' + error.message);
                submitBtn.textContent = originalText;
            } else {
                // DB write succeeded - delete whichever old files were replaced
                const oldFiles = [oldFileNameToDelete, oldBackgroundToDelete, oldVideoToDelete].filter(Boolean);
                if (oldFiles.length) {
                    console.log('Deleting old files:', oldFiles);
                    await client.storage.from('images').remove(oldFiles);
                }
                alert(editingProductId ? 'Produkt opdateret!' : 'Produkt gemt i Supabase!');
                resetFormState();
                loadProducts();
            }
            
            // UI: Stop Loading
            submitBtn.disabled = false;
            console.log("--- PROCESS COMPLETE ---");
        });

        function editProduct(id) {
            const product = products.find(p => String(p.id) === String(id));
            if (!product) return;

            // Populate form
            document.getElementById('new-title').value = product.title || '';
            document.getElementById('new-author').value = product.author || '';
            document.getElementById('new-price').value = product.price || '';
            document.getElementById('new-stock').value = product.stockQuantity || 0;
            document.getElementById('new-material').value = product.material || '';
            document.getElementById('new-dimensions').value = product.dimensions || '';
            document.getElementById('new-desc').value = product.description || '';
            document.getElementById('new-desc-en').value = product.description_en || '';

            // Show whether this product already has a background image
            const bgStatus = document.getElementById('background-status');
            if (product.background) {
                bgStatus.innerHTML = `Nuværende baggrund: <a href="${product.background}" target="_blank">se billede</a>. Vælg en fil for at erstatte den.`;
            } else {
                bgStatus.textContent = 'Ingen baggrund valgt endnu.';
            }

            // List the files this product currently has
            renderCurrentMedia(product);
            
            // File input is optional during edit
            document.getElementById('new-file').required = false;

            editingProductId = id;
            
            // Update UI
            const submitBtn = addForm.querySelector('button[type="submit"]');
            submitBtn.textContent = 'Opdater Produkt';
            submitBtn.classList.remove('btn-success');
            submitBtn.classList.add('btn-primary');
            
            document.querySelector('.editor-panel h2').textContent = 'Rediger Produkt';
            
            // Add Cancel button
            if (!document.getElementById('cancel-edit-btn')) {
                const cancelBtn = document.createElement('button');
                cancelBtn.id = 'cancel-edit-btn';
                cancelBtn.type = 'button';
                cancelBtn.textContent = 'Annuller';
                cancelBtn.className = 'btn-danger';
                cancelBtn.style.marginTop = '1rem';
                cancelBtn.style.marginLeft = '1rem';
                cancelBtn.onclick = resetFormState;
                addForm.appendChild(cancelBtn);
            }

            document.querySelector('.editor-panel').scrollIntoView({ behavior: 'smooth' });
        }

        // Lists the files a product currently has, each with a remove button.
        function renderCurrentMedia(product) {
            const wrap = document.getElementById('current-media');
            const list = document.getElementById('current-media-list');
            if (!wrap || !list) return;

            const entries = [
                { column: 'photo', label: 'Produktbillede', url: product.photo, kind: 'image' },
                { column: 'video', label: 'Video', url: product.video, kind: 'video' },
                { column: 'background', label: 'Baggrundsbillede', url: product.background, kind: 'image' }
            ].filter(e => e.url);

            if (!entries.length) {
                wrap.style.display = 'none';
                list.innerHTML = '';
                return;
            }

            wrap.style.display = '';
            list.innerHTML = '';

            entries.forEach(entry => {
                const row = document.createElement('div');
                row.style.cssText = 'display:flex; align-items:center; gap:0.75rem; padding:0.5rem; border:1px solid var(--color-border);';

                const preview = document.createElement(entry.kind === 'video' ? 'video' : 'img');
                preview.src = entry.url;
                preview.style.cssText = 'width:64px; height:64px; object-fit:cover; flex-shrink:0; background:#eee;';
                if (entry.kind === 'video') { preview.muted = true; preview.playsInline = true; }

                const info = document.createElement('div');
                info.style.cssText = 'flex:1; min-width:0;';
                const name = document.createElement('div');
                name.style.fontWeight = '500';
                name.textContent = entry.label;
                const link = document.createElement('a');
                link.href = entry.url;
                link.target = '_blank';
                link.style.cssText = 'font-size:0.75rem; color:#666; word-break:break-all;';
                link.textContent = entry.url.split('/').pop();
                info.append(name, link);

                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = 'Fjern';
                btn.className = 'btn-danger';
                btn.style.cssText = 'flex-shrink:0; padding:0.5rem 1rem; font-size:0.75rem;';
                btn.onclick = () => removeMedia(entry.column, entry.label);

                row.append(preview, info, btn);
                list.appendChild(row);
            });
        }

        // Clears one media column and deletes its stored file.
        async function removeMedia(column, label) {
            if (!editingProductId) return;
            if (!confirm(`Fjern ${label} fra dette produkt? Filen slettes permanent.`)) return;

            const product = products.find(p => String(p.id) === String(editingProductId));
            const url = product && product[column];

            // Clear the column first - if this fails, nothing has been destroyed
            const { error } = await client.from('products').update({ [column]: null }).eq('id', editingProductId);
            if (error) {
                console.error('Failed to clear ' + column, error);
                alert('Fejl: ' + error.message);
                return;
            }

            // Then remove the file, but only if it is one of ours in the bucket.
            // Older products point at files committed to the repo instead.
            if (url && url.includes('/images/')) {
                const fileName = url.split('/images/').pop();
                const { error: rmError } = await client.storage.from('images').remove([fileName]);
                if (rmError) console.warn('Column cleared but the file remains:', rmError);
            }

            alert(`${label} fjernet.`);
            await loadProducts();
            editProduct(editingProductId); // redraw the panel from fresh data
        }

        function resetFormState() {
            editingProductId = null;
            addForm.reset();
            document.getElementById('new-file').required = true;
            document.getElementById('background-status').textContent = 'Valgfrit — vises som baggrund på produktsiden.';
            const mediaWrap = document.getElementById('current-media');
            if (mediaWrap) mediaWrap.style.display = 'none';
            
            const submitBtn = addForm.querySelector('button[type="submit"]');
            submitBtn.textContent = 'Tilføj Produkt';
            submitBtn.classList.add('btn-success');
            submitBtn.classList.remove('btn-primary');
            
            document.querySelector('.editor-panel h2').textContent = 'Tilføj Nyt Produkt';
            
            const cancelBtn = document.getElementById('cancel-edit-btn');
            if (cancelBtn) cancelBtn.remove();
        }

        function exportData() {
            // Convert the data back into a JavaScript file string
            const fileContent = `const PRODUCT_CATALOG = ${JSON.stringify(products, null, 4)};`;
            
            // Create a blob and trigger download
            const blob = new Blob([fileContent], { type: 'text/javascript' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'products.js';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // --- AUTHENTICATION LOGIC ---
        
        // Check session on load
        async function checkSession() {
            const { data: { session } } = await client.auth.getSession();
            if (session) {
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('logout-btn').style.display = 'inline-block';
            } else {
                document.getElementById('login-overlay').style.display = 'flex';
                document.getElementById('logout-btn').style.display = 'none';
            }
        }

        // Login Handler
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            console.log("Logging in...");
            const email = document.getElementById('admin-email').value;
            const pass = document.getElementById('admin-pass').value;
            
            const { data, error } = await client.auth.signInWithPassword({
                email: email,
                password: pass,
            });

            if (error) {
                console.error("Login error:", error);
                alert('Login fejlede: ' + error.message);
            } else {
                console.log("Login success:", data);
                location.reload();
            }
        });

        // Logout Handler
        document.getElementById('logout-btn').addEventListener('click', async () => {
            await client.auth.signOut();
            location.reload();
        });

        // Initial Render
        checkSession();
        loadProducts();
    </script>
</body>
</html>
