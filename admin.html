<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kolofon Admin</title>
    <link rel="stylesheet" href="style.css">
    <script src="products.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .admin-container { max-width: 1000px; margin: 0 auto; padding: 2rem; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; padding-bottom: 1rem; border-bottom: 1px solid var(--color-border); }
        
        table { width: 100%; border-collapse: collapse; margin-bottom: 2rem; }
        th, td { text-align: left; padding: 1rem; border-bottom: 1px solid var(--color-border); }
        th { font-size: 0.75rem; text-transform: uppercase; color: #888; }
        
        .editor-panel { background: var(--color-bg-subtle); padding: 2rem; border-radius: 8px; margin-bottom: 2rem; }
        .editor-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        
        .btn-danger { background: #d32f2f; color: white; border: none; padding: 0.5rem 1rem; cursor: pointer; font-size: 0.75rem; text-transform: uppercase; }
        .btn-success { background: #2E7D32; color: white; border: none; padding: 1rem; cursor: pointer; text-transform: uppercase; letter-spacing: 0.05em; width: 100%; margin-top: 1rem; }
        .login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--color-bg); z-index: 2000; display: flex; align-items: center; justify-content: center; flex-direction: column; }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="logo-container">
            <span class="logo">KOLOFON // ADMIN</span>
        </div>
        <div class="nav-right">
            <button id="logout-btn" class="nav-text-btn" style="margin-right: 1rem; display: none;">Log ud</button>
            <a href="index.html" class="nav-text-btn">Tilbage til siden</a>
        </div>
    </header>

    <!-- Simulated Admin Login -->
    <div id="login-overlay" class="login-overlay">
        <h2 style="font-family: var(--font-serif); margin-bottom: 1.5rem;">Admin Login</h2>
        <form id="login-form" style="width: 100%; max-width: 300px;">
            <div class="form-group">
                <input type="email" id="admin-email" class="form-input" placeholder="admin@kolofon.com" required>
            </div>
            <div class="form-group">
                <input type="password" id="admin-pass" class="form-input" placeholder="Password" required>
            </div>
            <button type="submit" class="btn-primary full-width">Login</button>
        </form>
    </div>

    <main class="admin-container" style="padding-top: 80px;">
        <div class="admin-header">
            <h1>Administrator</h1>
            <div style="display: flex; gap: 1rem;">
                <button onclick="switchView('products')" id="tab-products" class="btn-primary">Produkter</button>
                <button onclick="switchView('orders')" id="tab-orders" class="btn-primary" style="background: transparent; color: #111; border: 1px solid #ccc;">Ordrer</button>
            </div>
            <div style="display: flex; gap: 1rem;">
                <button onclick="loadProducts()" class="btn-primary" style="background-color: #FF9800;">Genindlæs Data</button>
                <button onclick="exportData()" class="btn-primary">Eksporter & Download Katalog</button>
            </div>
        </div>

        <!-- PRODUCTS VIEW -->
        <div id="view-products">
            <table>
                <thead>
                    <tr>
                        <th>Billede (GLB)</th>
                        <th>Titel</th>
                        <th>Pris</th>
                        <th>Lagerantal</th>
                        <th>Handlinger</th>
                    </tr>
                </thead>
                <tbody id="product-table-body">
                    <!-- Rows generated by JS -->
                </tbody>
            </table>

            <!-- Add New Product -->
            <div class="editor-panel">
                <h2 style="margin-bottom: 1.5rem;">Tilføj Nyt Produkt</h2>
                <form id="add-form">
                    <div class="editor-grid">
                        <div class="form-group">
                            <label class="form-label">Titel</label>
                            <input type="text" id="new-title" class="form-input" placeholder="e.g. Abstract No. 5" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Kunstner</label>
                            <input type="text" id="new-author" class="form-input" placeholder="Artist Name">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Pris</label>
                            <input type="text" id="new-price" class="form-input" placeholder="DKK 2.000" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Lagerantal</label>
                            <input type="number" id="new-stock" class="form-input" placeholder="Antal enheder" value="1" min="0" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">GLB Fil (3D Model)</label>
                            <input type="file" id="new-file" class="form-input" accept=".glb" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Materiale</label>
                            <input type="text" id="new-material" class="form-input" placeholder="Acrylic Glass">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Dimensioner</label>
                            <input type="text" id="new-dimensions" class="form-input" placeholder='60cm x 90cm'>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Beskrivelse</label>
                        <textarea id="new-desc" class="form-input" rows="3" placeholder="Produkt beskrivelse..."></textarea>
                    </div>
                    <button type="submit" class="btn-success">Tilføj Produkt</button>
                </form>
            </div>
        </div>

        <!-- ORDERS VIEW -->
        <div id="view-orders" style="display: none;">
            <table>
                <thead>
                    <tr>
                        <th>Dato</th>
                        <th>Kunde</th>
                        <th>Varer</th>
                        <th>Total</th>
                    </tr>
                </thead>
                <tbody id="order-table-body">
                    <!-- Rows generated by JS -->
                </tbody>
            </table>
        </div>
    </main>

    <script>
        // Load data from global variable defined in products.js
        // --- SUPABASE CONNECTION ---
        const supabaseUrl = 'https://jxprvsfrsnikzkophoty.supabase.co';
        const supabaseKey = 'sb_publishable_PBq6r9zAfGDl77RxTzoGlw_NKLHIUP4';
        const client = supabase.createClient(supabaseUrl, supabaseKey);

        let products = [];
        let orders = [];

        async function loadProducts() {
            const { data, error } = await client
                .from('products')
                .select('*')
                .order('id', { ascending: true });

            if (error) {
                console.error('Error loading products:', error);
                alert('Kunne ikke hente produkter fra Supabase.');
                return;
            }

            // Normalize data
            products = data.map(p => ({ 
                ...p, 
                stockQuantity: p.stockQuantity ?? p.stockquantity ?? 0 
            }));
            renderTable();
        }

        async function loadOrders() {
            const { data, error } = await client
                .from('orders')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error('Error loading orders:', error);
                return;
            }
            orders = data;
            renderOrderTable();
        }

        const tableBody = document.getElementById('product-table-body');
        const orderTableBody = document.getElementById('order-table-body');
        const addForm = document.getElementById('add-form');

        function switchView(viewName) {
            const prodView = document.getElementById('view-products');
            const orderView = document.getElementById('view-orders');
            const btnProd = document.getElementById('tab-products');
            const btnOrder = document.getElementById('tab-orders');

            if (viewName === 'products') {
                prodView.style.display = 'block';
                orderView.style.display = 'none';
                btnProd.style.background = '#111'; btnProd.style.color = '#fff'; btnProd.style.border = 'none';
                btnOrder.style.background = 'transparent'; btnOrder.style.color = '#111'; btnOrder.style.border = '1px solid #ccc';
            } else {
                prodView.style.display = 'none';
                orderView.style.display = 'block';
                btnOrder.style.background = '#111'; btnOrder.style.color = '#fff'; btnOrder.style.border = 'none';
                btnProd.style.background = 'transparent'; btnProd.style.color = '#111'; btnProd.style.border = '1px solid #ccc';
                loadOrders();
            }
        }

        function renderTable() {
            tableBody.innerHTML = '';
            products.forEach((product, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td style="font-family: monospace; font-size: 0.85rem;">${product.src}</td>
                    <td><strong>${product.title}</strong></td>
                    <td>${product.price}</td>
                    <td>${product.stockQuantity > 0 ? product.stockQuantity + ' stk.' : '<span style="color:red">Udsolgt</span>'}</td>
                    <td>
                        <button onclick="deleteProduct('${product.id}')" class="btn-danger">Fjern</button>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        }

        function renderOrderTable() {
            orderTableBody.innerHTML = '';
            orders.forEach(order => {
                const date = new Date(order.created_at).toLocaleString('da-DK');
                const items = order.items.map(i => `${i.quantity}x ${i.title}`).join(', ');
                const customer = order.customer_details ? 
                    `<strong>${order.customer_details.fullName}</strong><br>${order.email}<br>${order.customer_details.address}, ${order.customer_details.city}` : 
                    order.email;

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td style="vertical-align: top;">${date}</td>
                    <td style="vertical-align: top;">${customer}</td>
                    <td style="vertical-align: top;">${items}</td>
                    <td style="vertical-align: top;">DKK ${parseFloat(order.total).toLocaleString('da-DK')}</td>
                `;
                orderTableBody.appendChild(row);
            });
        }

        async function deleteProduct(id) {
            if(!confirm('Er du sikker på, at du vil slette dette produkt fra databasen?')) return;

            // 1. Get the product to find the file path
            const { data: product, error: fetchError } = await client
                .from('products')
                .select('src')
                .eq('id', id)
                .single();

            // 2. Delete file from Storage (if it exists and is in our bucket)
            if (product && product.src && product.src.includes('/models/')) {
                const fileName = product.src.split('/models/').pop();
                const { error: storageError } = await client.storage.from('models').remove([fileName]);
                if (storageError) console.error('Fejl ved sletning af fil:', storageError);
            }

            // 3. Delete row from Database
            const { error } = await client.from('products').delete().eq('id', id);
            
            if (error) {
                alert('Fejl ved sletning: ' + error.message);
            } else {
                loadProducts();
            }
        }

        addForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // 1. Upload File to Supabase Storage
            const fileInput = document.getElementById('new-file');
            const file = fileInput.files[0];
            
            if (!file) {
                alert("Vælg venligst en fil.");
                return;
            }

            const fileName = `${Date.now()}_${file.name.replace(/\s+/g, '-')}`; // Clean filename
            const { data: uploadData, error: uploadError } = await client.storage.from('models').upload(fileName, file);

            if (uploadError) {
                alert('Fejl ved upload af fil: ' + uploadError.message);
                return;
            }

            // 2. Get Public URL
            const { data: { publicUrl } } = client.storage.from('models').getPublicUrl(fileName);

            const newProduct = {
                id: Date.now().toString(), // Simple unique ID
                title: document.getElementById('new-title').value,
                author: document.getElementById('new-author').value,
                price: document.getElementById('new-price').value,
                stockQuantity: parseInt(document.getElementById('new-stock').value, 10),
                src: publicUrl,
                material: document.getElementById('new-material').value,
                dimensions: document.getElementById('new-dimensions').value,
                description: document.getElementById('new-desc').value
            };

            const { error } = await client.from('products').insert([newProduct]);

            if (error) {
                alert('Fejl ved oprettelse: ' + error.message);
            } else {
                addForm.reset();
                loadProducts();
                alert('Produkt gemt i Supabase!');
            }
        });

        function exportData() {
            // Convert the data back into a JavaScript file string
            const fileContent = `const PRODUCT_CATALOG = ${JSON.stringify(products, null, 4)};`;
            
            // Create a blob and trigger download
            const blob = new Blob([fileContent], { type: 'text/javascript' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'products.js';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // --- AUTHENTICATION LOGIC ---
        
        // Check session on load
        async function checkSession() {
            const { data: { session } } = await client.auth.getSession();
            if (session) {
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('logout-btn').style.display = 'inline-block';
            } else {
                document.getElementById('login-overlay').style.display = 'flex';
                document.getElementById('logout-btn').style.display = 'none';
            }
        }

        // Login Handler
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            console.log("Logging in...");
            const email = document.getElementById('admin-email').value;
            const pass = document.getElementById('admin-pass').value;
            
            const { data, error } = await client.auth.signInWithPassword({
                email: email,
                password: pass,
            });

            if (error) {
                console.error("Login error:", error);
                alert('Login fejlede: ' + error.message);
            } else {
                console.log("Login success:", data);
                location.reload();
            }
        });

        // Logout Handler
        document.getElementById('logout-btn').addEventListener('click', async () => {
            await client.auth.signOut();
            location.reload();
        });

        // Initial Render
        checkSession();
        loadProducts();
    </script>
</body>
</html>
